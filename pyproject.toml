[project]
name = "ithildin"
version = "0.1.2"
description = "Open-source CAN bus analyser with a built-in MCP server"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tobias Hallberg", email = "tobias@mint-engineering.se" }]
keywords = ["can", "canbus", "automotive", "dbc", "mcp", "analyser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "python-can>=4.6.1",
    "cantools>=39",
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
    "pydantic>=2.7",
    "asammdf>=8.0",
    "tomli-w>=1.0",
    "mcp>=1.0",
    # 4.2 is the first whose CapacityLimiter can be built with no running
    # loop, as the MCP server builds it on the GUI thread.
    "anyio>=4.2",
    "uvicorn>=0.30",
    "uptime>=3.0.1",
    "gs-usb>=0.3.1",
    "pyusb>=1.2.1",
    "libusb-package>=1.0.26.1",
]

[project.scripts]
ithildin = "ithildin.app:main"

[project.urls]
Homepage = "https://github.com/tobias-hallberg/ithildin-can-analyzer"
Repository = "https://github.com/tobias-hallberg/ithildin-can-analyzer"
Issues = "https://github.com/tobias-hallberg/ithildin-can-analyzer/issues"
Changelog = "https://github.com/tobias-hallberg/ithildin-can-analyzer/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ithildin"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
packaging = [
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    # Stage names like "1.D.α / β / γ" and Tolkien references contain
    # Unicode characters that are not "ambiguous" in our context.
    "RUF001",  # ambiguous chars in strings
    "RUF002",  # ambiguous chars in docstrings
    "RUF003",  # ambiguous chars in comments
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libs without complete type stubs at our pin range.
module = [
    "can.*",
    "cantools.*",
    "asammdf.*",
    "pyqtgraph.*",
    "gs_usb.*",
    "usb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
qt_api = "pyside6"
# A test stuck this long dumps every thread's stack, instead of a CI job
# hanging silently until its timeout.
faulthandler_timeout = 120
